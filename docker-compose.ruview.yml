services:
  sensing-server:
    image: ruvnet/wifi-densepose:latest
    container_name: ruview-sensing
    restart: unless-stopped
    ports:
      - "3000:3000"        # REST API
      # uptime-kuma owns host port 3001 on this host, so remap WebSocket to 3011.
      - "3011:3001"        # WebSocket (host 3011 -> container 3001)
      # Docker Desktop on Windows collapses multi-source UDP at the WSL
      # boundary. Pair this mapping with scripts/udp-relay.py on the host,
      # which forwards host :5005 -> 127.0.0.1:5006 so every ESP32 node
      # appears as the same source IP to Docker.
      - "5006:5005/udp"
    environment:
      - RUST_LOG=info
      - CSI_SOURCE=esp32
      - MODELS_DIR=data/models

  mqtt-bridge:
    build:
      context: ./ruview-bridge
      dockerfile: Dockerfile
    image: ruview-mqtt-bridge:latest
    container_name: ruview-mqtt-bridge
    restart: unless-stopped
    depends_on:
      - sensing-server
    environment:
      - RUVIEW_URL=http://sensing-server:3000
      - MQTT_HOST=192.168.1.3
      - MQTT_PORT=1883
      - MQTT_USER=${RUVIEW_MQTT_USER}
      - MQTT_PASS=${RUVIEW_MQTT_PASS}
      - POLL_INTERVAL=2
      - NODE_MAP=1:bedroom,2:living_room
